[project]
name = "multi-agent-legal-workflow"
version = "1.0.0"
description = "LangGraph supervisor orchestrating legal review, compliance, and summary agents with a human approval gate"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
